<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排水系统实时控制汇报</title><style>body{margin:0;background:#101827;color:white;font-family:system-ui}main{height:calc(100dvh - 70px);display:flex;align-items:center;justify-content:center}img{max-width:100%;max-height:100%;object-fit:contain}nav{height:70px;display:flex;align-items:center;justify-content:center;gap:16px}button,a{background:#263b58;color:white;border:0;padding:10px 16px;border-radius:6px;text-decoration:none;cursor:pointer}button:disabled{opacity:.4} @media(max-width:600px){nav{gap:6px}button,a{padding:8px}}</style><main><img id="slide" alt="幻灯片"></main><nav><button id="prev">上一页</button><span id="counter"></span><button id="next">下一页</button><button id="full">全屏</button><a href="report.pptx" download>下载 PPT</a></nav><script>let page=Math.max(1,Math.min(19,parseInt(location.hash.slice(1))||1));const slide=document.getElementById('slide'),prev=document.getElementById('prev'),next=document.getElementById('next');function show(){slide.src='slides/slide-'+page+'.png';slide.alt='第 '+page+' 页，共 19 页';document.getElementById('counter').textContent=page+' / 19';prev.disabled=page===1;next.disabled=page===19;history.replaceState(null,'','#'+page)}function move(n){page=Math.max(1,Math.min(19,page+n));show()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);slide.onclick=()=>move(1);document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};document.onkeydown=e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}};show();</script></html>
